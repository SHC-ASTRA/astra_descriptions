ekf_global_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: dummy_base_link
    world_frame: map

    # odom0: /odometry/local
    # odom0_config: [false, false, false,
    #                false, false, false,
    #                true,  true,  false,
    #                false, false, true,
    #                false, false, false]
    # odom0_queue_size: 10

    # GPS converted to odometry by navsat_transform_node
    odom0: /odometry/gps
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10

    imu0: /core/imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
